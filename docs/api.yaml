openapi: 3.0.0
info:
  title: 小买卖点餐系统 API
  version: 2.0.0
  description: |
    面向线下小餐饮店的扫码点餐系统 API。

    ## 通用约定
    - 统一前缀 `/api/`
    - 统一响应格式：`{ code: number, data: T, message: string }`，code=0 表示成功
    - 金额单位：分（整数），如 500 = 5.00 元
    - 鉴权：Bearer Token（JWT），部分接口需 admin/rider 角色
    - HTTP 状态码：200 成功, 201 创建, 400 参数错误, 401 未认证, 403 无权限, 404 不存在, 500 服务器错误

servers:
  - url: http://localhost:3010/api
    description: 开发环境

# ============================================================
# 安全方案
# ============================================================
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ============================================================
  # 可复用 Schema
  # ============================================================
  schemas:
    # --- 通用响应信封 ---
    ApiResponse:
      type: object
      properties:
        code:
          type: number
          description: 业务状态码，0 表示成功
        data:
          description: 响应数据，类型随接口而异
        message:
          type: string
          description: 提示信息

    # --- 店铺 ---
    Shop:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        address: { type: string }
        phone: { type: string }
        logoUrl: { type: string }
        status: { type: string, enum: [open, closed] }
        deliveryRange: { type: integer, description: 配送范围（米） }
        deliveryFee: { type: integer, description: 配送费（分） }
        minOrderAmount: { type: integer, description: 起送价（分） }
        businessHours:
          $ref: '#/components/schemas/BusinessHours'
        isOpenNow: { type: boolean, description: 当前是否可下单 }
        nextOpenHint: { type: string, nullable: true, description: 下次营业提示 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BusinessHours:
      type: object
      description: 按星期配置的营业时段；空数组表示当日休息
      properties:
        sun:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        mon:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        tue:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        wed:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        thu:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        fri:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }
        sat:
          type: array
          items: { $ref: '#/components/schemas/TimeRange' }

    TimeRange:
      type: object
      required: [start, end]
      properties:
        start: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
        end: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }

    # --- 分类 ---
    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string }
        sortOrder: { type: integer }
        iconKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # --- 菜品 ---
    MenuItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, description: 单位：分 }
        imageUrl: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, inactive] }
        monthlySales: { type: integer }
        specGroupIds: { type: array, items: { type: string, format: uuid } }
        isFavorite: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # --- 规格组 ---
    SpecGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string }
        isRequired: { type: boolean }
        maxSelect: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/SpecOption' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SpecOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        specGroupId: { type: string, format: uuid }
        name: { type: string }
        priceAdjust: { type: integer, description: 价格修正（分） }
        isDefault: { type: boolean }

    # --- 订单 ---
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        menuItemId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        price: { type: integer, description: 单位：分 }
        specDesc: { type: string }
        imageUrl: { type: string }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        userId: { type: string }
        riderId: { type: string }
        status:
          type: string
          enum: [pending_payment, paid, accepted, preparing, delivering, ready_for_pickup, completed, cancelled, rejected]
        total: { type: integer, description: 总金额（分） }
        deliveryFee: { type: integer, description: 配送费（分） }
        deliveryType:
          type: string
          enum: [delivery, pickup, dine_in]
        address: { type: string }
        tableNo: { type: string }
        remark: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        invoiceNeeded: { type: boolean }
        invoiceTitle: { type: string }
        invoiceTaxNo: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        estimatedCompletion: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DeliveryTrackPoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        riderId: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        speed: { type: number }
        accuracy: { type: number }
        source: { type: string }
        recordedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # --- 促销 ---
    Promotion:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        name: { type: string }
        type:
          type: string
          enum: [full_discount, first_order, coupon]
        description: { type: string }
        rule:
          type: object
          description: 规则 JSON，如 { threshold: 3000, discount: 500 }
        status:
          type: string
          enum: [active, inactive, expired]
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # --- 用户 ---
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        openid: { type: string }
        role:
          type: string
          enum: [customer, admin, rider]
        shopId: { type: string, format: uuid }
        nickName: { type: string }
        avatarUrl: { type: string }
        createdAt: { type: string, format: date-time }

    # --- 支付 ---
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        userId: { type: string }
        transactionId: { type: string }
        amount: { type: integer, description: 单位：分 }
        method: { type: string, enum: [wechat, alipay, balance] }
        status: { type: string, enum: [pending, success, paid, refunded, failed] }
        paidAt: { type: string, format: date-time }
        mock: { type: boolean, description: 是否沙箱/模拟支付 }
        provider: { type: string, enum: [sandbox, wechat, third_party] }
        wxPayParams:
          type: object
          properties:
            timeStamp: { type: string }
            nonceStr: { type: string }
            package: { type: string }
            signType: { type: string, enum: [MD5, HMAC-SHA256, RSA] }
            paySign: { type: string }
        createdAt: { type: string, format: date-time }

    # --- 收藏 ---
    Favorite:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        menuItemId: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    # --- 统计 ---
    OrderStats:
      type: object
      properties:
        totalOrders: { type: integer }
        totalRevenue: { type: integer, description: 今日营收（分） }
        pendingCount: { type: integer }
        preparingCount: { type: integer }
        completedCount: { type: integer }

    DailyStatsItem:
      type: object
      properties:
        date: { type: string, description: YYYY-MM-DD }
        orders: { type: integer }
        revenue: { type: integer, description: 营收（分） }

    StatusDistributionItem:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        shopId: { type: string, format: uuid, nullable: true }
        contactName: { type: string }
        contactPhone: { type: string }
        detail: { type: string }
        tag: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        userId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 500 }
        replyContent: { type: string }
        replyAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ShopTable:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        tableNo: { type: string, maxLength: 32 }
        label: { type: string, maxLength: 64 }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
        scanPath: { type: string }
        createdAt: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        shopId: { type: string, format: uuid, nullable: true }
        userId: { type: string }
        role: { type: string, enum: [customer, admin, rider] }
        method: { type: string, enum: [POST, PUT, PATCH, DELETE] }
        path: { type: string }
        action: { type: string }
        resource: { type: string }
        resourceId: { type: string }
        summary: { type: string, maxLength: 500 }
        statusCode: { type: integer }
        ip: { type: string }
        createdAt: { type: string, format: date-time }

# ============================================================
# 路径定义
# ============================================================
paths:
  # ==================== 认证 ====================
  /auth/wechat-login:
    post:
      summary: 微信登录
      description: 通过微信 code 登录，返回 JWT token 和 refreshToken
      tags: [认证]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 微信登录 code }
                nickName: { type: string, description: 用户昵称 }
                avatarUrl: { type: string, description: 用户头像 URL }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          refreshToken: { type: string }
                          userId: { type: string }
                          openid: { type: string }
                          role: { type: string, enum: [customer, admin, rider] }
                          shopId: { type: string, format: uuid }
                          nickName: { type: string }

  /auth/refresh:
    post:
      summary: 刷新 Token
      description: 使用 refreshToken 获取新的 accessToken 和 refreshToken（Token 轮换）
      tags: [认证]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          refreshToken: { type: string }
        '401':
          description: refreshToken 无效或已过期

  # ==================== 店铺 ====================
  /shops:
    get:
      summary: 获取店铺列表
      tags: [店铺]
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Shop' }
    post:
      summary: 创建店铺
      tags: [店铺]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                address: { type: string }
                phone: { type: string }
                logoUrl: { type: string }
                status: { type: string, enum: [open, closed] }
                deliveryRange: { type: integer, description: 配送范围（米） }
                deliveryFee: { type: integer, description: 配送费（分） }
                minOrderAmount: { type: integer, description: 起送价（分） }
                businessHours: { $ref: '#/components/schemas/BusinessHours' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shop' }

  /shops/{id}:
    get:
      summary: 获取店铺详情
      tags: [店铺]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shop' }
    patch:
      summary: 更新店铺信息
      tags: [店铺]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                address: { type: string }
                phone: { type: string }
                logoUrl: { type: string }
                deliveryRange: { type: integer }
                deliveryFee: { type: integer }
                minOrderAmount: { type: integer }
                businessHours: { $ref: '#/components/schemas/BusinessHours' }
      responses:
        '200':
          description: 更新成功
    delete:
      summary: 删除店铺
      tags: [店铺]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 删除成功

  /shops/{id}/status:
    patch:
      summary: 切换店铺营业状态
      tags: [店铺]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: 服务端读取当前状态并在 open/closed 之间切换，不需要请求体。
      responses:
        '200':
          description: 更新成功

  /shops/{id}/business-hours:
    get:
      summary: 获取店铺营业时段
      tags: [店铺]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shopId: { type: string, format: uuid }
                          status: { type: string, enum: [open, closed] }
                          businessHours: { $ref: '#/components/schemas/BusinessHours' }
                          isOpenNow: { type: boolean }
                          nextOpenHint: { type: string, nullable: true }
    patch:
      summary: 更新店铺营业时段
      tags: [店铺]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessHours]
              properties:
                businessHours: { $ref: '#/components/schemas/BusinessHours' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Shop' }

  /shops/{id}/tables:
    get:
      summary: 获取启用中的桌台
      tags: [桌台]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ShopTable' }
    post:
      summary: 新增桌台
      tags: [桌台]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableNo]
              properties:
                tableNo: { type: string, minLength: 1, maxLength: 32 }
                label: { type: string, maxLength: 64 }
                sortOrder: { type: integer, minimum: 0 }
                active: { type: boolean }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ShopTable' }

  /shops/{id}/tables/manage:
    get:
      summary: 获取全部桌台（含停用）
      tags: [桌台]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ShopTable' }

  /shops/{id}/tables/seed:
    post:
      summary: 初始化默认桌台 A01-A10
      tags: [桌台]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: 初始化成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ShopTable' }

  /shops/{id}/tables/{tableId}:
    patch:
      summary: 更新桌台
      tags: [桌台]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tableId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tableNo: { type: string, minLength: 1, maxLength: 32 }
                label: { type: string, maxLength: 64 }
                sortOrder: { type: integer, minimum: 0 }
                active: { type: boolean }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ShopTable' }
    delete:
      summary: 删除桌台
      tags: [桌台]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tableId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 删除成功

  # ==================== 分类 ====================
  /categories:
    get:
      summary: 获取分类列表
      tags: [分类]
      security: []
      parameters:
        - { name: shop_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
    post:
      summary: 创建分类
      tags: [分类]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, shopId]
              properties:
                name: { type: string }
                shopId: { type: string, format: uuid }
                sortOrder: { type: integer }
                iconKey: { type: string }
      responses:
        '201':
          description: 创建成功

  /categories/{id}:
    patch:
      summary: 更新分类
      tags: [分类]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sortOrder: { type: integer }
                iconKey: { type: string }
      responses:
        '200':
          description: 更新成功
    delete:
