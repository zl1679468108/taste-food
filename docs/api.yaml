  # ==================== 订单 ====================
  /orders:
    get:
      summary: 获取订单列表
      tags: [订单]
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: shop_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
        - { name: rider_id, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/Order' }
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Order' }
                          total: { type: integer }
                          page: { type: integer }
                          pageSize: { type: integer }
    post:
      summary: 创建订单
      tags: [订单]
      description: |
        服务端校验金额：从数据库查询真实菜品价格，从店铺配置获取配送费并校验起送价。
        使用 atomic_create_order RPC 事务化创建订单+订单项+更新销量。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId, items, deliveryType]
              properties:
                shopId: { type: string, format: uuid }
                userId: { type: string, description: 可选，通常从 JWT 获取 }
                deliveryType:
                  type: string
                  enum: [delivery, pickup, dine_in]
                address: { type: string, description: delivery 类型必填 }
                tableNo: { type: string, description: dine_in 类型必填 }
                remark: { type: string }
                contactName: { type: string }
                contactPhone: { type: string }
                invoiceNeeded: { type: boolean }
                invoiceTitle: { type: string, maxLength: 100 }
                invoiceTaxNo: { type: string, maxLength: 32 }
                items:
                  type: array
                  items:
                    type: object
                    required: [menuItemId, name, quantity]
                    properties:
                      menuItemId: { type: string, format: uuid }
                      name: { type: string }
                      quantity: { type: integer, minimum: 1 }
                      price: { type: integer, description: 仅参考，服务端以数据库为准 }
                      specDesc: { type: string }
                      imageUrl: { type: string }
                      specOptionIds:
                        type: array
                        items: { type: string }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Order' }

  /orders/{id}:
    get:
      summary: 获取订单详情（含订单项）
      tags: [订单]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Order' }

  /orders/{id}/delivery-track:
    get:
      summary: 查询订单配送轨迹
      tags: [订单]
      description: 订单本人、本店商家、接单骑手可查询。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DeliveryTrackPoint' }
    post:
      summary: 上报配送位置
      tags: [订单]
      description: Rider/Admin 可上报配送中外卖订单位置。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                speed: { type: number, minimum: 0 }
                accuracy: { type: number, minimum: 0 }
                source: { type: string }
      responses:
        '200':
          description: 上报成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DeliveryTrackPoint' }

  /orders/{id}/status:
    post:
      summary: 更新订单状态
      tags: [订单]
      description: 状态机校验，仅允许合法流转（见 prd.md §5.2）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending_payment, paid, accepted, preparing, delivering, ready_for_pickup, completed, cancelled, rejected]
                remark: { type: string }
      responses:
        '200':
          description: 更新成功

  /orders/{id}/cancel:
    post:
      summary: 取消订单
      tags: [订单]
      description: 仅 pending_payment/paid 状态可取消；已支付订单取消时自动退款（tf_payments 状态置为 refunded）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 取消成功

  /orders/{id}/reorder:
    post:
      summary: 再来一单
      tags: [订单]
      description: 基于历史订单创建新订单
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: 创建成功

  /orders/{id}/grab:
    post:
      summary: 骑手抢单
      tags: [订单]
      description: 仅 accepted/preparing 状态可抢单，delivered 状态已有骑手
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 抢单成功

  /orders/{id}/deliver:
    post:
      summary: 骑手确认送达
      tags: [订单]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 确认送达成功

  /orders/stats/{shopId}:
    get:
      summary: 获取订单统计概览
      tags: [订单]
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrderStats' }

  /orders/stats/{shopId}/daily:
    get:
      summary: 获取每日订单统计（图表数据）
      tags: [订单]
      description: 按天聚合，初始化日期桶保证连续日期。多租户隔离校验。
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, default: 7, minimum: 1, maximum: 90 } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DailyStatsItem' }

  /orders/stats/{shopId}/status-distribution:
    get:
      summary: 获取订单状态分布
      tags: [订单]
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StatusDistributionItem' }

  # ==================== 支付 ====================
  /orders/{id}/pay:
    post:
      summary: 支付订单
      tags: [支付]
      description: |
        生产环境调用微信支付；开发环境支持模拟支付。
        响应包含 mock:true 标识模拟支付。生产环境禁用模拟支付。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 支付成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success: { type: boolean }
                          mock: { type: boolean, description: 是否模拟支付 }
                          paymentId: { type: string }

  /orders/{id}/payment:
    get:
      summary: 获取订单支付信息
