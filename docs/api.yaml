      tags: [分类]
      description: 调用 atomic_delete_category RPC，事务内删除分类及其下所有菜品
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 删除成功

  # ==================== 菜品 ====================
  /menu-items:
